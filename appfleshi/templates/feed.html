{% extends "homepage.html" %}

{% block title %}
    Fléshi - Feed
{% endblock %}

{% block body %}
    {% include "navbar.html" %}
    <h1>Feed Principal</h1>

    {% for photo in photos %}
        <div style="margin-bottom: 25px;">

            <a href="{{ url_for('profile', user_id=photo.user_id) }}">
                <img src="{{ url_for('static', filename='posts_photos/' ~ photo.file_name) }}"
                     alt="Imagem"
                     style="max-width: 350px; display: block;">
            </a>

            {% if photo.caption %}
                <p style="margin-top: 5px;">
                    <strong>{{ photo.user.username }}:</strong> {{ photo.caption }}
                </p>
            {% endif %}

        </div>
    {% endfor %}
{% endblock %}
